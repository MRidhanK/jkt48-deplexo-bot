<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JKT48 Ticket Radar</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1a1d27;--mut:#6b7185;--line:#e3e6ef;--ok:#16a34a;--no:#dc2626;--acc:#e11d48;--warn:#d97706;
padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b25;--text:#eceef5;--mut:#8b91a7;--line:#262a38}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1000px;margin:0 auto}
h1{font-size:17px;margin:0;flex:1;min-width:140px}
h1 b{color:var(--acc)}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--no);border-color:var(--no)}.pill.warn{color:var(--warn);border-color:var(--warn)}
.tabs{display:flex;gap:6px}
.tab,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=search]{flex:1;min-width:150px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
main{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum b{display:block;font-size:22px}.sum span{color:var(--mut);font-size:12px}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.m>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;gap:8px;align-items:center}
.m>summary::-webkit-details-marker{display:none}
.m .n{font-weight:600;flex:1}
.vip{color:var(--acc);font-size:12px}
.cnt{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--mut)}
.cnt.has{background:var(--ok);color:#fff}
.tw{overflow-x:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.q{font-weight:700}.q.ok{color:var(--ok)}.q.no{color:var(--no)}
.new{background:rgba(22,163,74,.12)}
.tag{font-size:11px;color:var(--ok);margin-left:6px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>🎫 JKT48 <b>Ticket Radar</b></h1>
    <span id="status" class="pill">memuat…</span>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="tabs" id="tabs"></div>
    <input type="search" id="q" placeholder="Cari member…">
    <label class="pill"><input type="checkbox" id="only"> hanya tersedia</label>
    <label class="pill"><input type="checkbox" id="beep"> 🔔 suara</label>
  </div>
</header>
<main>
  <div class="sum">
    <div><b id="s-lanes">-</b><span>jalur</span></div>
    <div><b id="s-av">-</b><span>tersedia</span></div>
    <div><b id="s-tix">-</b><span>total kuota</span></div>
  </div>
  <div id="list"></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get("key");
const API = "/api/lanes" + (KEY ? "?key=" + encodeURIComponent(KEY) : "");
const NEW_WINDOW = 600; // detik: tandai "restock baru"
let data = null, tab = null, prevQuota = new Map(), firstLoad = true;
const openMembers = new Set();

const rp = v => Number.isFinite(+v) ? "Rp" + (+v).toLocaleString("id-ID") : "-";
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function ago(ts, now) {
  if (!ts) return "belum ada data";
  const s = Math.max(0, Math.round(now - ts));
  return s < 60 ? s + " dtk lalu" : Math.round(s / 60) + " mnt lalu";
}

function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15;
    o.start(); o.stop(c.currentTime + .25);
  } catch {}
}

function render() {
  if (!data) return;
  const codes = Object.keys(data.events);
  if (!tab) tab = codes[0];
  const tabs = $("tabs"); tabs.textContent = "";
  for (const c of codes) {
    const b = el("button", "tab" + (c === tab ? " on" : ""), data.events[c].name);
    b.onclick = () => { tab = c; render(); };
    tabs.append(b);
  }

  const ev = data.events[tab], now = data.now, query = $("q").value.trim().toLowerCase(), only = $("only").checked;
  const age = ev.updated ? now - ev.updated : null;
  const st = $("status");
  st.className = "pill " + (age == null ? "bad" : age > data.stale_after ? "warn" : "ok");
  st.textContent = age == null ? "belum ada data" : (age > data.stale_after ? "⚠ data lama · " : "● live · ") + ago(ev.updated, now);

  const all = ev.lanes;
  $("s-lanes").textContent = all.length;
  $("s-av").textContent = all.filter(l => l.quota > 0).length;
  $("s-tix").textContent = all.reduce((a, l) => a + l.quota, 0);

  const groups = new Map();
  for (const l of all) {
    if (query && !String(l.member).toLowerCase().includes(query)) continue;
    if (only && l.quota <= 0) continue;
    if (!groups.has(l.member)) groups.set(l.member, []);
    groups.get(l.member).push(l);
  }

  const list = $("list"); list.textContent = "";
  if (!groups.size) { list.append(el("div", "empty", all.length ? "Tidak ada yang cocok." : "Menunggu data dari poller/worker…")); return; }

  const names = [...groups.keys()].sort((a, b) => {
    const sa = groups.get(a).reduce((x, l) => x + (l.quota > 0), 0), sb = groups.get(b).reduce((x, l) => x + (l.quota > 0), 0);
    return (sb > 0) - (sa > 0) || a.localeCompare(b);
  });

  for (const name of names) {
    const lanes = groups.get(name).sort((a, b) => (a.date + a.start + a.lane).localeCompare(b.date + b.start + b.lane));
    const avail = lanes.filter(l => l.quota > 0).length;
    const d = el("details", "m");
    const key = tab + "|" + name;
    d.open = openMembers.has(key) || !!query;
    d.ontoggle = () => d.open ? openMembers.add(key) : openMembers.delete(key);
    const sm = el("summary");
    sm.append(el("span", "n", name));
    if (lanes[0].vip) sm.append(el("span", "vip", "★ VIP"));
    sm.append(el("span", "cnt" + (avail ? " has" : ""), avail + "/" + lanes.length));
    d.append(sm);

    const tw = el("div", "tw"), t = el("table"), thead = el("thead"), hr = el("tr");
    ["Sesi", "Tanggal", "Waktu", "Jalur", "Harga", "Kuota"].forEach(h => hr.append(el("th", "", h)));
    thead.append(hr); t.append(thead);
    const tb = el("tbody");
    for (const l of lanes) {
      const tr = el("tr", l.restock_at && now - l.restock_at < NEW_WINDOW && l.quota > 0 ? "new" : "");
      tr.append(el("td", "", l.session), el("td", "", l.date), el("td", "", l.start + "–" + l.end), el("td", "", l.lane), el("td", "", rp(l.price)));
      const q = el("td"), qs = el("span", "q " + (l.quota > 0 ? "ok" : "no"), l.quota > 0 ? l.quota : "SO");
      q.append(qs);
      if (tr.className) q.append(el("span", "tag", "▲ restock " + ago(l.restock_at, now)));
      tr.append(q); tb.append(tr);
    }
    t.append(tb); tw.append(t); d.append(tw); list.append(d);
  }
}

function detectRestock(json) {
  let up = 0;
  for (const [code, ev] of Object.entries(json.events))
    for (const l of ev.lanes) {
      const k = code + "|" + l.sdc, prev = prevQuota.get(k);
      if (prev !== undefined && l.quota > prev) up++;
      prevQuota.set(k, l.quota);
    }
  if (up && !firstLoad) {
    document.title = "🟢 Restock! · JKT48 Ticket Radar";
    if ($("beep").checked) beep();
  }
  firstLoad = false;
}

async function load() {
  try {
    const r = await fetch(API, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
    detectRestock(data);
    render();
  } catch (e) {
    const st = $("status"); st.className = "pill bad"; st.textContent = "gagal memuat: " + e.message;
  }
}

$("q").oninput = $("only").onchange = render;
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "JKT48 Ticket Radar"; });
load(); setInterval(load, 10000);
</script>
</body>
</html>
